		<path d="M809.78 205.91h163.72c82.88 0 150.69 67.84 150.69 150.76s-67.84 150.76-150.69 150.76H777.75v205.91h195.78c196.07 0 356.47-160.48 356.47-356.68S1169.51 0 973.53 0H699.7c36.8 68.57 73.42 137.26 110.08 205.91Z" fill="#003362"/>
